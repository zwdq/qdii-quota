name: 每日更新基金额度

on:
  schedule:
    # UTC 时间 → 北京时间
    # 01:15 UTC = 北京 09:15（美股收盘次日，抓最新净值）
    # 06:15 UTC = 北京 14:15（盘中再抓一次，捕捉当日限购变动）
    - cron: "15 1,6 * * *"
  workflow_dispatch: {}  # 支持在 GitHub 页面手动触发

permissions:
  contents: write   # 允许 Action 把新 data.json 提交回仓库

concurrency:
  group: daily-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 抓取基金数据
        run: python3 scripts/fetch_funds.py data.json

      - name: 提交 data.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交。"
          else
            git commit -m "chore(data): 每日基金额度更新 $(date -u +%Y-%m-%d)"
            git push
          fi
